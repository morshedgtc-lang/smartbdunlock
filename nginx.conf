upstream smartbdunlock {
    server 127.0.0.1:3000;
    keepalive 64;
}

server {
    listen 80;
    server_name www.smartbdunlock.com smartbdunlock.com;
    return 301 https://$server_name$request_uri;
}

server {
    listen 443 ssl http2;
    server_name www.smartbdunlock.com smartbdunlock.com;

    ssl_certificate /etc/ssl/certs/smartbdunlock.crt;
    ssl_certificate_key /etc/ssl/private/smartbdunlock.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    # Security headers
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    # Rate limiting
    limit_req_zone $binary_remote_addr zone=api:10m rate=100r/s;
    limit_req_zone $binary_remote_addr zone=login:10m rate=5r/m;

    # Logs
    access_log /var/log/nginx/smartbdunlock-access.log;
    error_log /var/log/nginx/smartbdunlock-error.log;

    # Static assets (cache aggressively)
    location /_next/static {
        proxy_pass http://smartbdunlock;
        expires 365d;
        add_header Cache-Control "public, immutable";
    }

    location /static {
        proxy_pass http://smartbdunlock;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # Favicon
    location = /favicon.ico {
        proxy_pass http://smartbdunlock;
        expires 30d;
        add_header Cache-Control "public, immutable";
        log_not_found off;
    }

    # API routes
    location /api/ {
        limit_req zone=api burst=200 nodelay;
        proxy_pass http://smartbdunlock;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }

    # Auth rate limiting (stricter)
    location /api/auth/ {
        limit_req zone=login burst=10 nodelay;
        proxy_pass http://smartbdunlock;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # SSE streams (no buffering)
    location /api/notifications/stream {
        proxy_pass http://smartbdunlock;
        proxy_http_version 1.1;
        proxy_set_header Connection '';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_buffering off;
        proxy_cache off;
        chunked_transfer_encoding on;
    }

    # Health check
    location /api/health {
        access_log off;
        proxy_pass http://smartbdunlock;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    # Everything else
    location / {
        proxy_pass http://smartbdunlock;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }

    # Deny access to hidden files
    location ~ /\. {
        deny all;
        log_not_found off;
    }
}
